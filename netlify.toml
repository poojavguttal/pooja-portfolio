# Plain HTML, CSS and JavaScript: nothing to compile.
#
# This Netlify project was set up for the old Next.js site, so Netlify still
# expects the output in a ".next" folder. The build just copies the site's
# files into .next and publishes that. Once the project's framework setting
# in the Netlify dashboard is changed away from Next.js, this can become
# publish = "." with no command.
[build]
  command = "rm -rf .next && mkdir .next && cp -R index.html css js assets .next/"
  publish = ".next"

# Netlify's Next.js plugin is still attached to the project; there's no
# Next.js here any more, so tell it to skip itself.
[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
